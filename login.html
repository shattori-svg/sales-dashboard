<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">ログイン — LOPIA Thailand Sales Report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg); }
    .login-box { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-xl); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .login-box h2 { margin: 0 0 var(--space-lg); font-size: 1.25rem; text-align: center; }
    .login-box .form-group { margin-bottom: var(--space-md); }
    .login-box label { display: block; margin-bottom: var(--space-xs); font-weight: 500; font-size: var(--font-size-sm); }
    .login-box input { width: 100%; padding: var(--space-sm) var(--space-md); font-size: var(--font-size); border: 1px solid var(--border); border-radius: var(--radius); box-sizing: border-box; }
    .login-box .btn-login { width: 100%; margin-top: var(--space-md); padding: var(--space-sm) var(--space-md); background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: var(--font-size); font-weight: 500; cursor: pointer; }
    .login-box .btn-login:hover { background: var(--accent-hover); }
    .login-error { margin-top: var(--space-md); padding: var(--space-sm); background: #fef2f2; color: var(--error); border-radius: var(--radius); font-size: var(--font-size-sm); text-align: center; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h2 data-i18n="login_title_short">ログイン</h2>
      <form method="post" action="/login">
        <div class="form-group">
          <label for="username" data-i18n="login_username">ユーザー名</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login_password">パスワード</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" data-i18n="login_submit">ログイン</button>
      </form>
      <p id="login-error" class="login-error" hidden data-i18n="login_error">ユーザー名またはパスワードが正しくありません。</p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') === '1') {
        var el = document.getElementById('login-error');
        if (el) el.hidden = false;
      }
    })();
  </script>
</body>
</html>
