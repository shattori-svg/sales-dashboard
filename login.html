<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">ログイン — LOPIA Thailand Sales Report</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h2 data-i18n="login_title_short">ログイン</h2>
      <form method="post" action="/login">
        <div class="form-group">
          <label for="username" data-i18n="login_username">ユーザー名</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login_password">パスワード</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" data-i18n="login_submit">ログイン</button>
      </form>
      <p id="login-error" class="login-error" hidden data-i18n="login_error">ユーザー名またはパスワードが正しくありません。</p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') === '1') {
        var el = document.getElementById('login-error');
        if (el) el.hidden = false;
      }
    })();
  </script>
</body>
</html>
