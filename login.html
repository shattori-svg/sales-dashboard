<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">ログイン — LOPIA Thailand Sales Report</title>
  <link rel="stylesheet" href="style.css?v=login2">
</head>
<body class="login-body">
  <div class="login-page">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-card">
      <aside class="login-visual" aria-hidden="true">
        <div class="login-visual-chip">LOPIA</div>
        <h2 class="login-visual-title" data-i18n="login_visual_title">Sales Dashboard</h2>
        <p class="login-visual-text" data-i18n="login_visual_desc">店舗別・部門別の売上を、日次と時間帯で素早く確認できます。</p>
        <ul class="login-visual-list">
          <li data-i18n="login_visual_point_1">時間別集計と着地予測</li>
          <li data-i18n="login_visual_point_2">部門別の構成比分析</li>
          <li data-i18n="login_visual_point_3">日別・週別の推移比較</li>
        </ul>
      </aside>
      <div class="login-card-inner">
        <div class="login-lang-wrap">
          <label for="lang-select" class="lang-label" data-i18n="lang_label">言語</label>
          <select id="lang-select" aria-label="Language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="th">ไทย</option>
          </select>
        </div>
        <div class="login-brand">
          <span class="login-brand-name">LOPIA Thailand Sales Report</span>
          <span class="login-brand-sub" data-i18n="login_brand_sub">Sign in to continue</span>
        </div>
        <div id="login-form-container" class="login-form-wrap">
          <h1 class="login-heading" data-i18n="login_title_short">ログイン</h1>
          <form method="post" action="/login" class="login-form">
            <div class="form-group">
              <label for="username" data-i18n="login_username">ユーザー名</label>
              <input type="text" id="username" name="username" autocomplete="username" autofocus placeholder="username">
            </div>
            <div class="form-group">
              <label for="password" data-i18n="login_password">パスワード</label>
              <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" data-i18n="login_submit">ログイン</button>
          </form>
          <p id="login-error" class="login-error" hidden data-i18n="login_error">ユーザー名またはパスワードが正しくありません。</p>
        </div>
        <div id="bootstrap-form-container" class="login-form-wrap" style="display:none">
          <h1 class="login-heading" data-i18n="bootstrap_title">初回セットアップ</h1>
          <p class="login-lead" data-i18n="bootstrap_description">最初の管理者アカウントを作成してください。</p>
          <form id="bootstrap-form" class="login-form">
            <div class="form-group">
              <label for="bootstrap-username" data-i18n="login_username">ユーザー名</label>
              <input type="text" id="bootstrap-username" name="username" autocomplete="username" required minlength="1" placeholder="username">
            </div>
            <div class="form-group">
              <label for="bootstrap-password" data-i18n="login_password">パスワード</label>
              <input type="password" id="bootstrap-password" name="password" autocomplete="new-password" required minlength="6" placeholder="6文字以上">
            </div>
            <p class="form-hint" data-i18n="bootstrap_hint">パスワードは6文字以上で入力してください。</p>
            <button type="submit" class="btn-login" data-i18n="bootstrap_submit">作成してログイン</button>
          </form>
          <p id="bootstrap-error" class="login-error" hidden></p>
        </div>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') === '1') {
        var el = document.getElementById('login-error');
        if (el) el.hidden = false;
      }
      fetch('/api/auth/status').then(function (r) { return r.json(); }).then(function (data) {
        if (data.bootstrap) {
          document.getElementById('login-form-container').style.display = 'none';
          var box = document.getElementById('bootstrap-form-container');
          if (box) box.style.display = '';
          document.getElementById('bootstrap-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var un = document.getElementById('bootstrap-username').value.trim();
            var pw = document.getElementById('bootstrap-password').value;
            var errEl = document.getElementById('bootstrap-error');
            if (!un || pw.length < 6) {
              errEl.textContent = 'ユーザー名とパスワード（6文字以上）を入力してください。';
              errEl.hidden = false;
              return;
            }
            fetch('/api/bootstrap-admin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: un, password: pw })
            }).then(function (res) { return res.json().then(function (body) { return { res: res, body: body }; }); })
              .then(function (_) {
                if (_.res.ok && _.body.redirect) {
                  window.location.href = _.body.redirect;
                } else {
                  errEl.textContent = _.body && _.body.error ? _.body.error : '作成に失敗しました。';
                  errEl.hidden = false;
                }
              })
              .catch(function () {
                errEl.textContent = '通信エラーです。';
                errEl.hidden = false;
              });
          });
        }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
